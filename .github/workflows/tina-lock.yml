name: Generate tina-lock.json

on:
  workflow_dispatch:

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies (with native build)
        run: npm ci

      - name: Run tinacms dev briefly to register schema and generate tina-lock.json
        env:
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
        run: |
          # Run tinacms dev for up to 90s — kills itself once tina-lock.json appears
          timeout 90s bash -c '
            npx tinacms dev &
            TINA_PID=$!
            echo "Tina dev PID: $TINA_PID"
            for i in $(seq 1 90); do
              if [ -f tina-lock.json ]; then
                echo "tina-lock.json generated after ${i}s"
                kill $TINA_PID 2>/dev/null
                exit 0
              fi
              sleep 1
            done
            kill $TINA_PID 2>/dev/null
            echo "Timeout — tina-lock.json not generated"
            exit 1
          '

      - name: Verify file
        run: cat tina-lock.json | head -5

      - name: Commit tina-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tina-lock.json
          git commit -m "chore: add tina-lock.json para indexar branch no Tina Cloud [skip ci]"
          git push
