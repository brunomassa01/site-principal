name: Generate tina-lock.json

on:
  workflow_dispatch:

jobs:
  generate-lock:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies (with native build)
        run: npm install --legacy-peer-deps

      - name: Build Tina admin (gera tina-lock.json sem validacao cloud)
        env:
          TINA_CLIENT_ID: ${{ secrets.TINA_CLIENT_ID }}
          TINA_TOKEN: ${{ secrets.TINA_TOKEN }}
        run: |
          echo "TINA_CLIENT_ID definido: $( [ -n "$TINA_CLIENT_ID" ] && echo 'sim' || echo 'NAO' )"
          echo "TINA_TOKEN definido: $( [ -n "$TINA_TOKEN" ] && echo 'sim' || echo 'NAO' )"
          npx tinacms build --skip-cloud-checks
          echo "--- arquivos em tina/ apos build ---"
          ls -la tina/
          echo "--- find tina-lock ---"
          find . -name "tina-lock.json" 2>/dev/null || echo "(nenhum encontrado)"

      - name: Verify tina-lock.json was generated
        run: |
          if [ ! -f tina/tina-lock.json ]; then
            echo "ERROR: tina/tina-lock.json was not generated"
            exit 1
          fi
          echo "tina/tina-lock.json OK:"
          cat tina/tina-lock.json | head -10

      - name: Commit tina-lock.json
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add tina/tina-lock.json
          git diff --staged --quiet && echo "tina/tina-lock.json unchanged — nothing to commit" || \
            git commit -m "chore: generate tina-lock.json"
          git push
